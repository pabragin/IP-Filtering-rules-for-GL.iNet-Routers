name: Rebuild filter list

on:
  schedule:
    - cron: "17 3 * * *"   # ежедневно в 03:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "data/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build filter.txt
        run: python3 scripts/build.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add filter.txt report.md
          git diff --cached --quiet || git commit -m "Автообновление filter.txt ($(date -u +%F))"
          git push
